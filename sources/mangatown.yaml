# MangaTown: the html pages of the site. The images (zjcdn.mangahere.org) and the covers (fmcdn.mangahere.com)
# want the site as Referer.
name: MangaTown
baseUrl: https://www.mangatown.com
headers:
  mangahere.org: {Referer: 'https://www.mangatown.com/'}
  mangahere.com: {Referer: 'https://www.mangatown.com/'}

list:
  # the pagination ends at page 334, but the pages behind it are served as well (~800 pages in 2026)
  url: /directory/{page}.htm?name.az
  pageSize: 30
  estimatedPages: 800
  mangas:
    each: '<a class="manga_cover" href="(?<url>/manga/[^"]*?)" title="(?<title>.*?)">'
    popularity: 'Views:\s*(\d+)'

info:
  expect: 'class="detail_info'
  notFound: '>([^<>]*has been licensed[^<>]*)<'
  author: '(?s)<b>Author\(s\):</b>(.*?)</?li'
  artist: '(?s)<b>Artist\(s\):</b>(.*?)</?li'
  status: '<b>Status\(s\):</b>\s*([^<&]*)'
  genres: '(?s)<b>Genre\(s\):</b>(.*?)</li>'
  summary:
    match: '(?s)<span id="show"[^>]*>(.*?)(?:&nbsp;)?\s*(?:<a class="more"[^>]*>[^<]*</a>\s*)?</span>'
    remove: '\[.*?\]'
  cover: '<div class="detail_info[^"]*">\s*<img src="([^"]*)"'
  chapters:
    within: ['<ul class="chapter_list">', '</ul>']
    each: '<a href="(?<url>/manga/[^"]*)"[^>]*>(?<title>[^<]*)</a>'
    title: {lua: chapterTitle}
    order: newestFirst

pages:
  timeout: 7000
  expect: '<div id="viewer"'
  notFound: '>([^<>]*has been licensed[^<>]*)<'
  # long strips show all images on the chapter page
  images:
    within: ['<div id="viewer"', '<div class="manga_read|\z']
    each: '<img src="(?<url>[^"]*)" class="image"'
  # else there is a page of the site for each image
  count: ['var total_pages\s*=\s*(\d+)',
          '>(\d+)</option>\s*?(?:<option\s*?value="/manga/[^"]*?"\s*?>Featured</option>)?\s*?</select>']
  page: '{chapter}/{n}.html'

image:
  when: '\.html$'
  within: ['<div id="viewer"']
  url: ['<img src="([^"]*)"[^>]*id="image"', '<img[^>]*src="([^"]*)"']
