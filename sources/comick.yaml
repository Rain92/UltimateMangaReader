# Comick: comick.art, the unofficial mirror that continues the comick database (same slugs and api; comick.io, now
# comick.dev, hosts no chapter images since september 2025), all of it in comick.lua. Nearly all pages and covers
# are webp, the image cdn blocks requests without a Referer.
name: Comick
baseUrl: https://comick.art
headers:
  comicknew.pictures: {Referer: 'https://comick.art/'}
# The cdn answers 429 for a few seconds while it pulls an image into its cache (the origin is throttled for all
# users): an image download waits for it, 1 + 2 + 4 + 8 + 8 + 8 s at most.
images: {retries: 6, retryDelay: 1000, maxRetryDelay: 8000}
